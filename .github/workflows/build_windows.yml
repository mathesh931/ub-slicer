name: Build UB Slicer for Windows

# Builds the Windows installer (UB_Slicer_Windows_Installer_V*.exe) and a portable zip.
#  - every change to main and every pull request: download them from the run's "Artifacts"
#  - a tag like v1.0.0: also published on the repository's Releases page
# The first run builds Orca's libraries (about 1.5 hours) and keeps them; later runs take about 45 minutes.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "doc/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "doc/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish a release on tags

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022 # has Visual Studio 2022, which Orca 2.3.1's build scripts use
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: CMake 3.28 (the version Orca builds with)
        run: pip install cmake==3.28.4

      - name: Visual Studio build tools
        uses: microsoft/setup-msbuild@v2

      - name: Windows SDK
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory | Where-Object Name -like "10.*" | Sort-Object Name | Select-Object -Last 1
          "WindowsSdkDir=C:\Program Files (x86)\Windows Kits\10\" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "WindowsSDKVersion=$($sdk.Name)\" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          $ver = (Select-String -Path version.inc -Pattern 'set\(SoftFever_VERSION "(.*)"\)').Matches[0].Groups[1].Value
          "ver=$ver" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          Write-Output "SDK $($sdk.Name), version $ver"

      # Orca's libraries (wxWidgets, Boost, OpenCV …): built once, then reused until deps/ changes.
      - name: Restore built libraries
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: deps/build/OrcaSlicer_dep
          key: windows-deps-${{ hashFiles('deps/**') }}

      - name: Build libraries (first time only)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          choco install strawberryperl -y --no-progress
          .\build_release_vs2022.bat deps
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path deps\build\OrcaSlicer_dep\usr\local)) { throw "Building the libraries failed" }

      - name: Keep built libraries for next time
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build/OrcaSlicer_dep
          key: windows-deps-${{ hashFiles('deps/**') }}

      - name: Build UB Slicer
        run: |
          .\build_release_vs2022.bat slicer
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path build\OrcaSlicer\ub-slicer.exe)) { throw "Building UB Slicer failed" }

      - name: Make the installer
        working-directory: build
        run: |
          choco install nsis -y --no-progress
          cpack -G NSIS
          if ($LASTEXITCODE -ne 0) { throw "Making the installer failed" }

      - name: Make the portable zip
        shell: pwsh
        run: |
          Copy-Item -Recurse build\OrcaSlicer "build\UB Slicer"
          & "C:\Program Files\7-Zip\7z.exe" a -tzip "build\UB_Slicer_Windows_V$env:ver`_portable.zip" "build\UB Slicer"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UB_Slicer_Windows_Installer_V${{ env.ver }}
          path: build/UB_Slicer_Windows_Installer_*.exe

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: UB_Slicer_Windows_V${{ env.ver }}_portable
          path: build/UB_Slicer_Windows_*_portable.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem build\UB_Slicer_Windows_Installer_*.exe) + @(Get-ChildItem build\UB_Slicer_Windows_*_portable.zip)
          gh release create "${{ github.ref_name }}" $files.FullName --title "UB Slicer ${{ github.ref_name }}" --notes "Windows installer and portable zip. Based on OrcaSlicer $env:ver."
