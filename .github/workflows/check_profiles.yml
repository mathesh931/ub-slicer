name: Check printer profiles

# Checks the built-in printer, process and filament profiles (Unbound3D, Custom, filament library)
# with Orca's own profile tool whenever they change.

on:
  push:
    branches: [main]
    paths: ["resources/profiles/**", ".github/workflows/check_profiles.yml"]
  pull_request:
    branches: [main]
    paths: ["resources/profiles/**", ".github/workflows/check_profiles.yml"]
  workflow_dispatch:

jobs:
  profiles:
    name: Check profiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Orca's profile tool
        run: python3 ./scripts/orca_profile_tool.py check
